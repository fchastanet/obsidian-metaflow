---
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit, manual]
minimum_pre_commit_version: 4.3.0
fail_fast: true
repos:

  - repo: https://github.com/executablebooks/mdformat
    # Do this before other tools "fixing" the line endings
    rev: 0.7.22
    hooks:
      - id: mdformat
        name: Format Markdown
        entry: mdformat # Executable to run, with fixed options
        language: python
        types: [markdown]
        args: [--wrap, "120", --number]
        additional_dependencies:
          - mdformat-toc
          - mdformat-frontmatter
          - mdformat-shfmt
          - mdformat-tables
          - mdformat-config
          - mdformat-web
          - mdformat-gfm
        exclude: |
          (?x)(
            ^\.github/prompts/
          )

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: mixed-line-ending
      - id: end-of-file-fixer
        exclude: |
          (?x)(
            testsData/
          )
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
        exclude: |
          (?x)(
            \.gtpl$
          )
      - id: check-xml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: fix-byte-order-marker
      - id: check-yaml
        exclude: |
          (?x)(
            ^internal/model/testsData/transformModel-error/|
            ^internal/model/testsData/transformModel-ok/BinData-commands-default-definitionFiles-duplicateKey.yaml$
          )
      - id: trailing-whitespace
        exclude: |
          (?x)(
            testsData/
          )
        stages: [pre-commit, pre-push, manual]
      - id: check-added-large-files
      - id: forbid-new-submodules
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: file-contents-sorter
        files: .cspell/.*\.txt
        args: [--ignore-case]
        stages: [pre-commit, pre-push, manual]
      - id: check-json
        # x modifier: extended. Spaces and text after a # in the pattern are ignored
        exclude: |
          (?x)(
            ^.vscode\/.*\.json$
          )

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint
        stages: [pre-commit, pre-push, manual]

  - repo: https://github.com/fchastanet/jumanjihouse-pre-commit-hooks
    rev: 3.0.2
    hooks:
      # Check both committed and uncommitted files for git conflict
      # markers and whitespace errors according to core.whitespace
      # and conflict-marker-size configuration in a git repo.
      - id: git-check
        # x modifier: extended. Spaces and text after a # in the pattern are ignored
        exclude: |
          (?x)(
            /testsData/
          )

  - repo: https://github.com/fchastanet/bash-tools-framework
    rev: 6.2.4
    hooks:
      - id: plantuml
        args: [--same-dir, -f, png, -f, svg, --limit-size, "8290"]

  - repo: local
    hooks:
      - id: build
        name: build
        entry: npm run build
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: lint
        name: lint
        entry: npm run lint
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: test
        name: test
        entry: npm run test
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
